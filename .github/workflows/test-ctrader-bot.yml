name: Test cTrader signal engine

on:
  push:
    branches:
      - ctrader-multimarket-demo
    paths:
      - "ctrader-bot/**"
      - ".github/workflows/test-ctrader-bot.yml"
  pull_request:
    paths:
      - "ctrader-bot/**"
      - ".github/workflows/test-ctrader-bot.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ctrader-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run strategy tests
        run: python -m unittest -v test_strategy.py
      - name: Check application imports
        run: python -c "from app import app; print(app.title)"
