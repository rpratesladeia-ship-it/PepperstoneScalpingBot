name: Python strategy and AI filter tests

on:
  push:
    branches: [ctrader-multimarket-demo]
    paths:
      - "ctrader-bot/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "ctrader-bot/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r ctrader-bot/requirements.txt
      - run: python -m compileall -q ctrader-bot
      - run: python -m unittest discover -s ctrader-bot -p "test_*.py" -v
