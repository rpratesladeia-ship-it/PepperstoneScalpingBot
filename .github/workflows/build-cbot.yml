name: Build cTrader cBot

on:
  workflow_dispatch:
  push:
    paths:
      - 'PepperstoneScalpingBot.cs'
      - 'PepperstoneScalpingBot.csproj'
      - '.github/workflows/build-cbot.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Show cTrader CLI version
        run: docker run --rm ghcr.io/spotware/ctrader-console:5.9.10 --version

      - name: Compile cBot (maximum 3 minutes)
        timeout-minutes: 4
        run: |
          timeout 180s docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/spotware/ctrader-console:5.9.10 \
            ctrader-cli build /workspace/PepperstoneScalpingBot.csproj

      - name: Locate compiled file
        run: |
          find . -type f -name '*.algo' -print
          test -n "$(find . -type f -name '*.algo' -print -quit)"

      - name: Upload compiled file
        uses: actions/upload-artifact@v4
        with:
          name: PepperstoneScalpingBot-algo
          path: '**/*.algo'
          if-no-files-found: error
