name: Build cTrader cBot

on:
  workflow_dispatch:
  push:
    paths:
      - 'PepperstoneScalpingBot.cs'
      - 'PepperstoneScalpingBot.csproj'
      - '.github/workflows/build-cbot.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show SDK version
        run: dotnet --version

      - name: Restore cTrader project
        run: dotnet restore PepperstoneScalpingBot.csproj

      - name: Compile cBot
        run: dotnet build PepperstoneScalpingBot.csproj --configuration Release --no-restore

      - name: Verify .algo output
        shell: bash
        run: |
          find . -type f -name '*.algo' -print
          test -n "$(find . -type f -name '*.algo' -print -quit)"

      - name: Upload compiled cBot
        uses: actions/upload-artifact@v4
        with:
          name: PepperstoneScalpingBot-algo
          path: '**/*.algo'
          if-no-files-found: error
