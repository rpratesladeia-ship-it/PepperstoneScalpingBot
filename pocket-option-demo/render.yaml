services:
  - type: web
    name: pocket-option-demo-cloud
    runtime: node
    plan: free
    buildCommand: cd pocket-option-demo && npm install
    startCommand: cd pocket-option-demo && npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
